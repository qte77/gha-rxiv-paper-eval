name: Evaluate rxiv papers (manual)

# Thin wrapper that exposes the reusable `eval-papers.yaml` workflow to the
# Actions UI. The reusable workflow auto-derives the eval repo + ref from
# `github.workflow_ref` / `github.workflow_sha`, so this dispatcher just
# forwards inputs.

on:
  workflow_dispatch:
    inputs:
      topic:
        description: >-
          Free-text topic the relevance filter judges against. Empty = use
          the script's built-in DEFAULT_TOPIC (qte77 account themes).
        type: string
        required: false
        default: ""
      server:
        description: "Preprint server."
        type: choice
        options: [biorxiv, medrxiv, arxiv]
        default: biorxiv
      year:
        description: "ISO year (YYYY). Empty = current ISO year (UTC)."
        type: string
        default: ""
      week:
        description: "ISO week (1-53). Empty = current ISO week (UTC)."
        type: string
        default: ""
      categories:
        description: "Comma-separated category allowlist. Empty = no pre-filter."
        type: string
        default: ""
      max_papers:
        description: "Cap rows sent to the LLM. 0 = no cap."
        type: number
        default: 5
      model:
        description: "GitHub Models model id."
        type: string
        default: openai/gpt-4o-mini
      enrich:
        description: "Fetch abstracts and run the extraction prompt."
        type: boolean
        default: true
      feed_repo:
        description: >-
          Producer repo. Empty = ${caller-owner}/gha-rxiv-feed-action.
        type: string
        default: ""

permissions:
  contents: read
  models: read

jobs:
  eval:
    uses: ./.github/workflows/eval-papers.yaml
    with:
      topic: ${{ inputs.topic }}
      server: ${{ inputs.server }}
      year: ${{ inputs.year }}
      week: ${{ inputs.week }}
      categories: ${{ inputs.categories }}
      # fromJSON wrappers force JSON coercion of typed workflow_dispatch
      # inputs before passing to workflow_call. Without them GHA fails the
      # reusable-workflow startup with no jobs running (PR #44 tried to drop
      # these on actionlint's advice — actionlint's static type model does
      # not match GHA's runtime serialization). actionlint emits a spurious
      # "bool/number cannot be assigned to string" warning on these lines;
      # the runtime behavior contradicts the warning, so it's left as-is.
      max_papers: ${{ fromJSON(inputs.max_papers) }}
      model: ${{ inputs.model }}
      enrich: ${{ fromJSON(inputs.enrich) }}
      feed_repo: ${{ inputs.feed_repo }}
