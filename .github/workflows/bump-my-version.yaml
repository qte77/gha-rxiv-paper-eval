name: bump-my-version

# Dispatch a semver bump. Thin caller of the shared qte77/.github reusable: it bumps
# the version files listed under [tool.bumpversion] in pyproject.toml (pyproject,
# README / docs / example pins, and the CHANGELOG [Unreleased] promotion into a
# dated release block), resyncs uv.lock, makes one signed commit on a bump branch
# and opens a PR. Merge the PR after CI is green; tag-release.yaml then tags vX.Y.Z
# against the squash-merge commit.

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Semver part to bump"
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: read

jobs:
  bump:
    uses: qte77/.github/.github/workflows/bump-version.yml@aeef158fdd62a865aecd03571eaecbe3aa8169e4  # v0.1.2
    with:
      bump_type: ${{ inputs.bump_type }}
      use_uv: true
      sync_lockfile: true
      pr_title_template: "feat(release): v{current}"
    permissions:
      contents: write
      pull-requests: write
