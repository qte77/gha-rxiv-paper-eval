name: tag-release

# Fires when a version bump lands on main (the squash-merge of a bump-my-version
# PR touches pyproject.toml). Thin caller of the shared qte77/.github reusable:
# tags vX.Y.Z (annotated) on a version change, no-op otherwise, and never
# overwrites or deletes an existing tag.

on:
  push:
    branches: [main]
    paths: [pyproject.toml]

permissions:
  contents: read

jobs:
  tag:
    uses: qte77/.github/.github/workflows/tag-release.yml@main
    permissions:
      contents: write
