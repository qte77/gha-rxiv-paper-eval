name: Evaluate rxiv papers (reusable)

on:
  workflow_call:
    inputs:
      topic:
        description: >-
          Free-text topic the relevance filter judges against. Empty = use
          the script's built-in DEFAULT_TOPIC (qte77 account themes).
        type: string
        required: false
        default: ""
      server:
        description: "Preprint server: biorxiv, medrxiv, or arxiv."
        type: string
        default: biorxiv
      year:
        description: "ISO year (YYYY). Empty = year of the newest week the feed has published (auto-discovered)."
        type: string
        default: ""
      week:
        description: "ISO week (1-53). Empty = newest week the feed has published for this server (auto-discovered; resilient to the feed's variable publish lag)."
        type: string
        default: ""
      categories:
        description: "Comma-separated category allowlist applied before the LLM step. Empty = no pre-filter."
        type: string
        default: ""
      max_papers:
        description: "Cap rows sent to the LLM (after category pre-filter). 0 = no cap."
        type: number
        default: 0
      max_llm_calls:
        description: "After the category/max_papers filter, rank survivors by topic-keyword overlap (title+category+abstract) and send only the top N to the LLM. 0 = no cap. Prefer over max_papers to stay under provider daily quotas."
        type: number
        default: 0
      model:
        description: >-
          Model id used for both relevance and extraction, in whatever form
          the target provider expects (e.g. a Cloudflare Workers AI id like
          `@cf/meta/llama-3.3-70b-instruct-fp8-fast`). GitHub Models is
          retired (2026-07-30); the `openai/...` default is a historical
          no-op unless `api_base` is also set.
        type: string
        default: openai/gpt-4o-mini
      api_base:
        description: >-
          OpenAI-compatible chat-completions base URL (no path), e.g.
          Cloudflare Workers AI's
          `https://api.cloudflare.com/client/v4/accounts/<id>/ai/v1`,
          OpenRouter's `https://openrouter.ai/api/v1`, or Cerebras's
          `https://api.cerebras.ai/v1`. The script appends
          `/chat/completions`. Empty (default) falls back to GitHub Models'
          now-retired endpoint — set this for any live run. Pair with the
          `llm-api-key` secret.
        type: string
        required: false
        default: ""
      enrich:
        description: "If true, run the structured-extraction prompt on the producer CSV's `Abstract` column for each YES verdict."
        type: boolean
        default: true
      relevance_prompt_template:
        description: "Override the default relevance system prompt template. {topic} placeholder is substituted."
        type: string
        default: ""
      relevance_prompt:
        description: "Deprecated alias of `relevance_prompt_template` (logs a warning). Ignored when `relevance_prompt_template` is set."
        type: string
        default: ""
      extraction_prompt:
        description: "Override the default extraction system prompt."
        type: string
        default: ""
      feed_repo:
        description: >-
          Producer repo that hosts data/<server>/<year>/<week>.csv.
          Empty = ${caller-owner}/gha-rxiv-feed-action.
        type: string
        default: ""
      python_version:
        description: "Python version to set up for the eval script."
        type: string
        default: "3.12"
      eval_repo:
        description: >-
          owner/repo that hosts THIS reusable workflow's source (script +
          Makefile). Cross-repo callers (including consumers of forks) MUST
          override to match their `uses:` pin. Default targets the canonical
          home; fork users set `<their-org>/gha-rxiv-paper-eval`.
        type: string
        default: qte77/gha-rxiv-paper-eval
      eval_ref:
        description: >-
          ref (tag, branch, or SHA) of `eval_repo` to check out. MUST match
          the `uses: @<ref>` pin in the caller workflow so the script
          version aligns with the workflow version. `github.workflow_ref` /
          `github.workflow_sha` cannot be auto-derived inside a reusable
          workflow — they resolve to the CALLER's workflow, not this one
          (the prior auto-derivation in v0.2.0 broke all cross-repo callers).
        type: string
        required: true
      decide_enabled:
        description: >-
          Route the relevance predicate through the shared decide() gate (a
          calibrated-confidence decision model) before falling back to the
          existing chat YES/NO call for its uncertain middle band and for
          escalations (missing credential, timeout, malformed response).
          Off by default — an existing caller that doesn't set this sees no
          behavior change at all.
        type: boolean
        default: false
      decide_backend:
        description: >-
          decide() backend. Only `clef` (Cloudflare Workers AI decision
          models) is wired up by this workflow today — it reuses the same
          `api_base`/`llm-api-key` (or `llm-api-base` secret) as `CF_WORKERS_AI_TOKEN`/`LLM_BASE_URL`.
        type: string
        default: clef
      decide_model:
        description: "decide() model id for the clef backend: clef-flash (9B) or clef (27B)."
        type: string
        default: clef
      decide_hi:
        description: >-
          decide() confidence threshold for the "act" band (string, not
          number — GitHub Actions' typed `number` input has bitten this
          repo before with workflow_dispatch coercion; a plain string avoids
          the question entirely and the script parses it as a float).
          0.75 is a starting point for the `clef` model from a separate,
          in-sample calibration run (100 arXiv papers, agent-assigned
          labels, threshold picked with a <=5% error-rate rule on acted
          items) that used a stricter relevance criterion than this
          workflow's own default prompt — it was NOT calibrated against
          `decide_instructions` below. Tune it if a run's decide-vs-chat
          split looks off for your topic.
        type: string
        default: "0.75"
      decide_instructions:
        description: >-
          Override decide()'s relevance-predicate instructions (a {topic}
          template, same placeholder as relevance_prompt_template). Empty
          (default) uses this workflow's own default criterion, phrased as
          a predicate question — which will NOT match a custom
          relevance_prompt_template. Set this whenever you also set
          relevance_prompt_template and decide_enabled, so both paths judge
          papers the same way; otherwise the script logs a GitHub Actions
          warning annotation when it detects the mismatch.
        type: string
        default: ""
    secrets:
      llm-api-base:
        description: >-
          Optional secret form of `api_base`, for callers who treat the
          OpenAI-compatible base URL itself as sensitive (it embeds a
          Cloudflare account id). Takes priority over the `api_base` input
          when both are set. Also feeds decide()'s `LLM_BASE_URL` when
          `decide_enabled` is true and `decide_backend` is `clef`.
        required: false
      models-token:
        description: >-
          Optional override for the auto-provided GITHUB_TOKEN used for the
          `gh api` feed-CSV fetch (unrelated to the LLM provider). Falls
          back to GITHUB_TOKEN when absent, which is sufficient for typical
          weekly batches against the public feed repo. Historically also
          doubled as the GitHub Models bearer token, but GitHub Models is
          retired — use `llm-api-key` for the LLM provider instead.
        required: false
      llm-api-key:
        description: >-
          Bearer token for the OpenAI-compatible provider named by
          `api_base` (e.g. a Cloudflare Workers AI API token). Falls back
          to GITHUB_TOKEN/`models-token` when absent, which only works
          against GitHub Models' now-retired endpoint — set this for any
          live run against a real provider.
        required: false
    outputs:
      relevant_count:
        description: "Number of papers that passed the relevance filter."
        value: ${{ jobs.evaluate.outputs.relevant_count }}
      artifact_name:
        description: "Name of the uploaded artifact containing eval outputs."
        value: ${{ jobs.evaluate.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    outputs:
      relevant_count: ${{ steps.run.outputs.relevant_count }}
      artifact_name: ${{ steps.run.outputs.artifact_name }}
    steps:
      - name: Checkout eval repo
        # `eval_repo` + `eval_ref` are explicit because reusable workflows
        # cannot reliably introspect their own source repo at runtime —
        # both `github.workflow_ref` and `github.workflow_sha` resolve to
        # the CALLER's workflow. Caller MUST pass `eval_ref` matching the
        # `uses: @<ref>` pin so the script version aligns.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.eval_repo }}
          ref: ${{ inputs.eval_ref }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - name: Install deps
        run: make setup

      - name: Check out the decide action (qte77/.github)
        # Only needed when decide_enabled opts in — the shared decision gate
        # has no PyPI package, so the script imports decide.py straight from
        # this checkout (see `_load_decide`). Pinned by commit SHA: that repo
        # has no tags.
        if: ${{ inputs.decide_enabled }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: qte77/.github
          ref: 43ad1211e962f82fab823377dcc7272054d8196c  # main 2026-11-10 (clef backend since #47)
          path: decide-src
          persist-credentials: false

      - name: Run evaluation
        id: run
        env:
          # Feed-CSV `gh api` fetch only — unrelated to the LLM provider.
          # Optional: pass secrets.models-token (fine-grained PAT) if you hit
          # quota issues against the (public) feed repo.
          GH_TOKEN: ${{ secrets.models-token || secrets.GITHUB_TOKEN }}
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_SERVER: ${{ inputs.server }}
          INPUT_YEAR: ${{ inputs.year }}
          INPUT_WEEK: ${{ inputs.week }}
          INPUT_CATEGORIES: ${{ inputs.categories }}
          INPUT_MAX_PAPERS: ${{ inputs.max_papers }}
          INPUT_MAX_LLM_CALLS: ${{ inputs.max_llm_calls }}
          INPUT_MODEL: ${{ inputs.model }}
          INPUT_ENRICH: ${{ inputs.enrich }}
          INPUT_FEED_REPO: ${{ inputs.feed_repo }}
          RELEVANCE_PROMPT: ${{ inputs.relevance_prompt_template || inputs.relevance_prompt }}
          INPUT_DEPRECATED_RELEVANCE_PROMPT: ${{ inputs.relevance_prompt }}
          EXTRACTION_PROMPT: ${{ inputs.extraction_prompt }}
          # Secret takes priority over the plain input (both ultimately feed
          # RXIV_EVAL_API_BASE below) — see the `llm-api-base` secret's
          # description.
          INPUT_API_BASE: ${{ secrets.llm-api-base || inputs.api_base }}
          INPUT_LLM_API_KEY: ${{ secrets.llm-api-key }}
          INPUT_DECIDE_ENABLED: ${{ inputs.decide_enabled }}
          INPUT_DECIDE_BACKEND: ${{ inputs.decide_backend }}
          INPUT_DECIDE_MODEL: ${{ inputs.decide_model }}
          INPUT_DECIDE_HI: ${{ inputs.decide_hi }}
          INPUT_DECIDE_INSTRUCTIONS: ${{ inputs.decide_instructions }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_DEPRECATED_RELEVANCE_PROMPT" ]]; then
            echo "::warning title=Deprecated input::relevance_prompt is deprecated; rename it to relevance_prompt_template (same {topic} template)."
          fi
          feed_repo="${INPUT_FEED_REPO:-${GITHUB_REPOSITORY_OWNER}/gha-rxiv-feed-action}"
          args=(
            --feed-repo "$feed_repo"
            --server "$INPUT_SERVER"
            --model "$INPUT_MODEL"
            --max-papers "$INPUT_MAX_PAPERS"
            --output-dir output
          )
          # 0 = no cap, the script's own default. Omitting the flag keeps
          # older `eval_ref` pins (pre---max-llm-calls) working (#80).
          [[ "$INPUT_MAX_LLM_CALLS" != "0" ]] && args+=(--max-llm-calls "$INPUT_MAX_LLM_CALLS")
          [[ -n "$INPUT_TOPIC" ]] && args+=(--topic "$INPUT_TOPIC")
          [[ -n "$INPUT_YEAR" ]] && args+=(--year "$INPUT_YEAR")
          [[ -n "$INPUT_WEEK" ]] && args+=(--week "$INPUT_WEEK")
          [[ -n "$INPUT_CATEGORIES" ]] && args+=(--categories "$INPUT_CATEGORIES")
          [[ "$INPUT_ENRICH" == "true" ]] && args+=(--enrich)
          # Only export when non-empty — an empty env var is harmless to the
          # script's own falsy check, but omitting it keeps the subprocess
          # environment honest about what was actually configured.
          [[ -n "$INPUT_API_BASE" ]] && export RXIV_EVAL_API_BASE="$INPUT_API_BASE"
          [[ -n "$INPUT_LLM_API_KEY" ]] && export RXIV_EVAL_LLM_API_KEY="$INPUT_LLM_API_KEY"
          if [[ "$INPUT_DECIDE_ENABLED" == "true" ]]; then
            export RXIV_EVAL_DECIDE_DIR="decide-src/actions/decide"
            export RXIV_EVAL_DECIDE_BACKEND="$INPUT_DECIDE_BACKEND"
            export RXIV_EVAL_DECIDE_MODEL="$INPUT_DECIDE_MODEL"
            export RXIV_EVAL_DECIDE_HI="$INPUT_DECIDE_HI"
            [[ -n "$INPUT_DECIDE_INSTRUCTIONS" ]] && export DECIDE_INSTRUCTIONS="$INPUT_DECIDE_INSTRUCTIONS"
            # decide()'s own env var names (its clef backend reads these
            # directly, independent of this script's RXIV_EVAL_* convention)
            # — reusing the same api_base/llm-api-key the chat fallback uses
            # keeps a single secret/account per caller.
            export CF_WORKERS_AI_TOKEN="$INPUT_LLM_API_KEY"
            export LLM_BASE_URL="$INPUT_API_BASE"
          fi

          uv run --no-dev python scripts/eval_papers.py "${args[@]}"
          cat output/.workflow_outputs >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ steps.run.outputs.artifact_name }}
          path: output/
          if-no-files-found: error
