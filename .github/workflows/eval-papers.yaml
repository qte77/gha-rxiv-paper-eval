name: Evaluate rxiv papers (reusable)

on:
  workflow_call:
    inputs:
      topic:
        description: >-
          Free-text topic the relevance filter judges against. Empty = use
          the script's built-in DEFAULT_TOPIC (qte77 account themes).
        type: string
        required: false
        default: ""
      server:
        description: "Preprint server: biorxiv, medrxiv, or arxiv."
        type: string
        default: biorxiv
      year:
        description: "ISO year (YYYY). Empty = current ISO year (UTC)."
        type: string
        default: ""
      week:
        description: "ISO week (1-53). Empty = current ISO week (UTC)."
        type: string
        default: ""
      categories:
        description: "Comma-separated category allowlist applied before the LLM step. Empty = no pre-filter."
        type: string
        default: ""
      max_papers:
        description: "Cap rows sent to the LLM (after category pre-filter). 0 = no cap."
        type: number
        default: 0
      model:
        description: "GitHub Models model id used for both relevance and extraction."
        type: string
        default: openai/gpt-4o-mini
      enrich:
        description: "If true, fetch abstracts from the rxiv API and run the structured-extraction prompt."
        type: boolean
        default: true
      relevance_prompt:
        description: "Override the default relevance system prompt. {topic} placeholder is substituted."
        type: string
        default: ""
      extraction_prompt:
        description: "Override the default extraction system prompt."
        type: string
        default: ""
      feed_repo:
        description: >-
          Producer repo that hosts data/<server>/<year>/<week>.csv.
          Empty = ${caller-owner}/gha-rxiv-feed-action.
        type: string
        default: ""
      python_version:
        description: "Python version to set up for the eval script."
        type: string
        default: "3.12"
    secrets:
      models-token:
        description: >-
          Token with `models: read` permission for GitHub Models. Required.
          A fine-grained PAT or org-scoped token works; the default GITHUB_TOKEN
          on `pull_request` from forks (and some org policies) cannot call
          GitHub Models, hence the explicit secret.
        required: true
    outputs:
      relevant_count:
        description: "Number of papers that passed the relevance filter."
        value: ${{ jobs.evaluate.outputs.relevant_count }}
      artifact_name:
        description: "Name of the uploaded artifact containing eval outputs."
        value: ${{ jobs.evaluate.outputs.artifact_name }}

permissions:
  contents: read
  models: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    outputs:
      relevant_count: ${{ steps.run.outputs.relevant_count }}
      artifact_name: ${{ steps.run.outputs.artifact_name }}
    steps:
      - name: Resolve eval-repo source from workflow_ref
        id: eval_src
        # github.workflow_ref looks like:
        #   <owner>/<repo>/.github/workflows/<file>@<ref>
        # We strip /.github/* to get owner/repo and use workflow_sha (the
        # commit the reusable workflow file was loaded from) so the script
        # version always matches the workflow version the caller pinned.
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          repo="${WORKFLOW_REF%/.github/*}"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "sha=${WORKFLOW_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout eval repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: ${{ steps.eval_src.outputs.repo }}
          ref: ${{ steps.eval_src.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Run evaluation
        id: run
        env:
          # Used for both `gh api` (feed fetch) and the GitHub Models REST
          # POST inside the script. Must carry `models: read`.
          GH_TOKEN: ${{ secrets.models-token }}
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_SERVER: ${{ inputs.server }}
          INPUT_YEAR: ${{ inputs.year }}
          INPUT_WEEK: ${{ inputs.week }}
          INPUT_CATEGORIES: ${{ inputs.categories }}
          INPUT_MAX_PAPERS: ${{ inputs.max_papers }}
          INPUT_MODEL: ${{ inputs.model }}
          INPUT_ENRICH: ${{ inputs.enrich }}
          INPUT_FEED_REPO: ${{ inputs.feed_repo }}
          RELEVANCE_PROMPT: ${{ inputs.relevance_prompt }}
          EXTRACTION_PROMPT: ${{ inputs.extraction_prompt }}
        run: |
          set -euo pipefail
          feed_repo="${INPUT_FEED_REPO:-${GITHUB_REPOSITORY_OWNER}/gha-rxiv-feed-action}"
          args=(
            --feed-repo "$feed_repo"
            --server "$INPUT_SERVER"
            --model "$INPUT_MODEL"
            --max-papers "$INPUT_MAX_PAPERS"
            --output-dir output
          )
          [[ -n "$INPUT_TOPIC" ]] && args+=(--topic "$INPUT_TOPIC")
          [[ -n "$INPUT_YEAR" ]] && args+=(--year "$INPUT_YEAR")
          [[ -n "$INPUT_WEEK" ]] && args+=(--week "$INPUT_WEEK")
          [[ -n "$INPUT_CATEGORIES" ]] && args+=(--categories "$INPUT_CATEGORIES")
          [[ "$INPUT_ENRICH" == "true" ]] && args+=(--enrich)

          python scripts/eval_papers.py "${args[@]}"

          relevant=$(python -c "import csv; print(sum(1 for _ in csv.reader(open('output/relevant.csv'))) - 1)")
          echo "relevant_count=${relevant}" >> "$GITHUB_OUTPUT"

          read -r y w < output/.resolved_yw
          echo "artifact_name=rxiv-eval-${INPUT_SERVER}-${y}-w${w}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.run.outputs.artifact_name }}
          path: output/
          if-no-files-found: error
