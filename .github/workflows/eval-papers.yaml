name: Evaluate rxiv papers (reusable)

on:
  workflow_call:
    inputs:
      topic:
        description: "Free-text topic the relevance filter will judge against."
        type: string
        required: true
      server:
        description: "Preprint server: biorxiv or medrxiv."
        type: string
        default: biorxiv
      year:
        description: "ISO year (YYYY). Empty = current ISO year (UTC)."
        type: string
        default: ""
      week:
        description: "ISO week (1-53). Empty = current ISO week (UTC)."
        type: string
        default: ""
      categories:
        description: "Comma-separated category allowlist applied before the LLM step. Empty = no pre-filter."
        type: string
        default: ""
      max_papers:
        description: "Cap rows sent to the LLM (after category pre-filter). 0 = no cap."
        type: number
        default: 0
      model:
        description: "Model id used for both relevance and extraction. Format depends on the provider (e.g. 'openai/gpt-4o-mini' for github-models, 'gemini-2.5-flash-lite' for gemini, 'claude-haiku-4-5' for anthropic)."
        type: string
        default: openai/gpt-4o-mini
      provider:
        description: "Classifier backend: github-models | gemini | anthropic. Default github-models is free; gemini is the designated free-tier backup; anthropic is paid, opt-in only."
        type: string
        default: github-models
      enrich:
        description: "If true, fetch abstracts from the rxiv API and run the structured-extraction prompt."
        type: boolean
        default: true
      relevance_prompt:
        description: "Override the default relevance system prompt. {topic} placeholder is substituted."
        type: string
        default: ""
      extraction_prompt:
        description: "Override the default extraction system prompt."
        type: string
        default: ""
      feed_repo:
        description: "Producer repo that hosts data/<server>/<year>/<week>.csv."
        type: string
        default: Lambda-Biolab/gha-rxiv-feed-action
      eval_repo_ref:
        description: "Ref of gha-rxiv-paper-eval to check out (tag/branch/SHA)."
        type: string
        default: main
    secrets:
      models-token:
        description: >-
          Token with `models: read` permission for GitHub Models. Required
          when provider=github-models. A fine-grained PAT or org-scoped
          token works; the default GITHUB_TOKEN on `pull_request` from
          forks (and some org policies) cannot call GitHub Models, hence
          the explicit secret.
        required: false
      gemini-api-key:
        description: >-
          Google AI Studio API key. Required when provider=gemini.
        required: false
      anthropic-api-key:
        description: >-
          Anthropic API key. Required when provider=anthropic.
          Paid provider; opt-in only.
        required: false
    outputs:
      relevant_count:
        description: "Number of papers that passed the relevance filter."
        value: ${{ jobs.evaluate.outputs.relevant_count }}
      artifact_name:
        description: "Name of the uploaded artifact containing eval outputs."
        value: ${{ jobs.evaluate.outputs.artifact_name }}

permissions:
  contents: read
  models: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    outputs:
      relevant_count: ${{ steps.run.outputs.relevant_count }}
      artifact_name: ${{ steps.run.outputs.artifact_name }}
    steps:
      - name: Checkout eval repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: Lambda-Biolab/gha-rxiv-paper-eval
          ref: ${{ inputs.eval_repo_ref }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          enable-cache: true

      - name: Install deps
        run: uv sync --no-dev

      - name: Run evaluation
        id: run
        env:
          # GH_TOKEN serves the `gh api` feed fetch and, when
          # provider=github-models, the inference REST POST.
          GH_TOKEN: ${{ secrets.models-token }}
          GEMINI_API_KEY: ${{ secrets.gemini-api-key }}
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_SERVER: ${{ inputs.server }}
          INPUT_YEAR: ${{ inputs.year }}
          INPUT_WEEK: ${{ inputs.week }}
          INPUT_CATEGORIES: ${{ inputs.categories }}
          INPUT_MAX_PAPERS: ${{ inputs.max_papers }}
          INPUT_MODEL: ${{ inputs.model }}
          INPUT_PROVIDER: ${{ inputs.provider }}
          INPUT_ENRICH: ${{ inputs.enrich }}
          INPUT_FEED_REPO: ${{ inputs.feed_repo }}
          RELEVANCE_PROMPT: ${{ inputs.relevance_prompt }}
          EXTRACTION_PROMPT: ${{ inputs.extraction_prompt }}
        run: |
          set -euo pipefail
          args=(
            --feed-repo "$INPUT_FEED_REPO"
            --server "$INPUT_SERVER"
            --topic "$INPUT_TOPIC"
            --model "$INPUT_MODEL"
            --provider "$INPUT_PROVIDER"
            --max-papers "$INPUT_MAX_PAPERS"
            --output-dir output
          )
          [[ -n "$INPUT_YEAR" ]] && args+=(--year "$INPUT_YEAR")
          [[ -n "$INPUT_WEEK" ]] && args+=(--week "$INPUT_WEEK")
          [[ -n "$INPUT_CATEGORIES" ]] && args+=(--categories "$INPUT_CATEGORIES")
          [[ "$INPUT_ENRICH" == "true" ]] && args+=(--enrich)

          uv run python scripts/eval_papers.py "${args[@]}"

          relevant=$(python -c "import csv; print(sum(1 for _ in csv.reader(open('output/relevant.csv'))) - 1)")
          echo "relevant_count=${relevant}" >> "$GITHUB_OUTPUT"

          read -r y w < output/.resolved_yw
          echo "artifact_name=rxiv-eval-${INPUT_SERVER}-${y}-w${w}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.run.outputs.artifact_name }}
          path: output/
          if-no-files-found: error
