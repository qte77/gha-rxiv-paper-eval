name: Evaluate rxiv papers (reusable)

on:
  workflow_call:
    inputs:
      topic:
        description: >-
          Free-text topic the relevance filter judges against. Empty = use
          the script's built-in DEFAULT_TOPIC (qte77 account themes).
        type: string
        required: false
        default: ""
      server:
        description: "Preprint server: biorxiv, medrxiv, or arxiv."
        type: string
        default: biorxiv
      year:
        description: "ISO year (YYYY). Empty = year of the newest week the feed has published (auto-discovered)."
        type: string
        default: ""
      week:
        description: "ISO week (1-53). Empty = newest week the feed has published for this server (auto-discovered; resilient to the feed's variable publish lag)."
        type: string
        default: ""
      categories:
        description: "Comma-separated category allowlist applied before the LLM step. Empty = no pre-filter."
        type: string
        default: ""
      max_papers:
        description: "Cap rows sent to the LLM (after category pre-filter). 0 = no cap."
        type: number
        default: 0
      max_llm_calls:
        description: "After the category/max_papers filter, rank survivors by topic-keyword overlap (title+category+abstract) and send only the top N to the LLM. 0 = no cap. Prefer over max_papers to stay under provider daily quotas."
        type: number
        default: 0
      model:
        description: >-
          Model id used for both relevance and extraction, in whatever form
          the target provider expects (e.g. a Cloudflare Workers AI id like
          `@cf/meta/llama-3.3-70b-instruct-fp8-fast`). GitHub Models is
          retired (2026-07-30); the `openai/...` default is a historical
          no-op unless `api_base` is also set.
        type: string
        default: openai/gpt-4o-mini
      api_base:
        description: >-
          OpenAI-compatible chat-completions base URL (no path), e.g.
          Cloudflare Workers AI's
          `https://api.cloudflare.com/client/v4/accounts/<id>/ai/v1`,
          OpenRouter's `https://openrouter.ai/api/v1`, or Cerebras's
          `https://api.cerebras.ai/v1`. The script appends
          `/chat/completions`. Empty (default) falls back to GitHub Models'
          now-retired endpoint — set this for any live run. Pair with the
          `llm-api-key` secret.
        type: string
        required: false
        default: ""
      enrich:
        description: "If true, run the structured-extraction prompt on the producer CSV's `Abstract` column for each YES verdict."
        type: boolean
        default: true
      relevance_prompt:
        description: "Override the default relevance system prompt. {topic} placeholder is substituted."
        type: string
        default: ""
      extraction_prompt:
        description: "Override the default extraction system prompt."
        type: string
        default: ""
      feed_repo:
        description: >-
          Producer repo that hosts data/<server>/<year>/<week>.csv.
          Empty = ${caller-owner}/gha-rxiv-feed-action.
        type: string
        default: ""
      python_version:
        description: "Python version to set up for the eval script."
        type: string
        default: "3.12"
      eval_repo:
        description: >-
          owner/repo that hosts THIS reusable workflow's source (script +
          Makefile). Cross-repo callers (including consumers of forks) MUST
          override to match their `uses:` pin. Default targets the canonical
          home; fork users set `<their-org>/gha-rxiv-paper-eval`.
        type: string
        default: qte77/gha-rxiv-paper-eval
      eval_ref:
        description: >-
          ref (tag, branch, or SHA) of `eval_repo` to check out. MUST match
          the `uses: @<ref>` pin in the caller workflow so the script
          version aligns with the workflow version. `github.workflow_ref` /
          `github.workflow_sha` cannot be auto-derived inside a reusable
          workflow — they resolve to the CALLER's workflow, not this one
          (the prior auto-derivation in v0.2.0 broke all cross-repo callers).
        type: string
        required: true
    secrets:
      models-token:
        description: >-
          Optional override for the auto-provided GITHUB_TOKEN used for the
          `gh api` feed-CSV fetch (unrelated to the LLM provider). Falls
          back to GITHUB_TOKEN when absent, which is sufficient for typical
          weekly batches against the public feed repo. Historically also
          doubled as the GitHub Models bearer token, but GitHub Models is
          retired — use `llm-api-key` for the LLM provider instead.
        required: false
      llm-api-key:
        description: >-
          Bearer token for the OpenAI-compatible provider named by
          `api_base` (e.g. a Cloudflare Workers AI API token). Falls back
          to GITHUB_TOKEN/`models-token` when absent, which only works
          against GitHub Models' now-retired endpoint — set this for any
          live run against a real provider.
        required: false
    outputs:
      relevant_count:
        description: "Number of papers that passed the relevance filter."
        value: ${{ jobs.evaluate.outputs.relevant_count }}
      artifact_name:
        description: "Name of the uploaded artifact containing eval outputs."
        value: ${{ jobs.evaluate.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    outputs:
      relevant_count: ${{ steps.run.outputs.relevant_count }}
      artifact_name: ${{ steps.run.outputs.artifact_name }}
    steps:
      - name: Checkout eval repo
        # `eval_repo` + `eval_ref` are explicit because reusable workflows
        # cannot reliably introspect their own source repo at runtime —
        # both `github.workflow_ref` and `github.workflow_sha` resolve to
        # the CALLER's workflow. Caller MUST pass `eval_ref` matching the
        # `uses: @<ref>` pin so the script version aligns.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: ${{ inputs.eval_repo }}
          ref: ${{ inputs.eval_ref }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true

      - name: Install deps
        run: make setup

      - name: Run evaluation
        id: run
        env:
          # Feed-CSV `gh api` fetch only — unrelated to the LLM provider.
          # Optional: pass secrets.models-token (fine-grained PAT) if you hit
          # quota issues against the (public) feed repo.
          GH_TOKEN: ${{ secrets.models-token || secrets.GITHUB_TOKEN }}
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_SERVER: ${{ inputs.server }}
          INPUT_YEAR: ${{ inputs.year }}
          INPUT_WEEK: ${{ inputs.week }}
          INPUT_CATEGORIES: ${{ inputs.categories }}
          INPUT_MAX_PAPERS: ${{ inputs.max_papers }}
          INPUT_MAX_LLM_CALLS: ${{ inputs.max_llm_calls }}
          INPUT_MODEL: ${{ inputs.model }}
          INPUT_ENRICH: ${{ inputs.enrich }}
          INPUT_FEED_REPO: ${{ inputs.feed_repo }}
          RELEVANCE_PROMPT: ${{ inputs.relevance_prompt }}
          EXTRACTION_PROMPT: ${{ inputs.extraction_prompt }}
          INPUT_API_BASE: ${{ inputs.api_base }}
          INPUT_LLM_API_KEY: ${{ secrets.llm-api-key }}
        run: |
          set -euo pipefail
          feed_repo="${INPUT_FEED_REPO:-${GITHUB_REPOSITORY_OWNER}/gha-rxiv-feed-action}"
          args=(
            --feed-repo "$feed_repo"
            --server "$INPUT_SERVER"
            --model "$INPUT_MODEL"
            --max-papers "$INPUT_MAX_PAPERS"
            --max-llm-calls "$INPUT_MAX_LLM_CALLS"
            --output-dir output
          )
          [[ -n "$INPUT_TOPIC" ]] && args+=(--topic "$INPUT_TOPIC")
          [[ -n "$INPUT_YEAR" ]] && args+=(--year "$INPUT_YEAR")
          [[ -n "$INPUT_WEEK" ]] && args+=(--week "$INPUT_WEEK")
          [[ -n "$INPUT_CATEGORIES" ]] && args+=(--categories "$INPUT_CATEGORIES")
          [[ "$INPUT_ENRICH" == "true" ]] && args+=(--enrich)
          # Only export when non-empty — an empty env var is harmless to the
          # script's own falsy check, but omitting it keeps the subprocess
          # environment honest about what was actually configured.
          [[ -n "$INPUT_API_BASE" ]] && export RXIV_EVAL_API_BASE="$INPUT_API_BASE"
          [[ -n "$INPUT_LLM_API_KEY" ]] && export RXIV_EVAL_LLM_API_KEY="$INPUT_LLM_API_KEY"

          uv run --no-dev python scripts/eval_papers.py "${args[@]}"
          cat output/.workflow_outputs >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.run.outputs.artifact_name }}
          path: output/
          if-no-files-found: error
