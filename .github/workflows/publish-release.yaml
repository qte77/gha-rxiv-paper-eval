name: publish-release

# Create a GitHub Release for a tag (defaults to the latest v* tag). Thin caller
# of the shared qte77/.github reusable: notes come from the matching CHANGELOG
# section (auto-generated if empty); never overwrites an existing Release.
# Manual dispatch keeps tagging and releasing decoupled.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (defaults to the latest v* tag)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    uses: qte77/.github/.github/workflows/publish-release.yml@c367e03ffaafb53994782d8ab5cb897a383f9318  # main 2026-10-31
    with:
      tag: ${{ inputs.tag }}
    permissions:
      contents: write
