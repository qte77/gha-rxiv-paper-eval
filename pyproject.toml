[project]
name = "gha-rxiv-paper-eval"
version = "0.1.0"
description = "Reusable GitHub Actions workflow that filters preprint feeds via GitHub Models."
authors = [
    {name = "qte77", email = "qte@77.gh"}
]
readme = "README.md"
requires-python = ">=3.10"

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
