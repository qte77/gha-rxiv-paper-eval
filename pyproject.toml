[project]
name = "gha-rxiv-paper-eval"
version = "0.3.0"
description = "Reusable GitHub Actions workflow that filters preprint feeds via GitHub Models."
authors = [
    {name = "qte77", email = "qte@77.gh"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "bump-my-version>=0.29",
    "complexipy>=4.0",
    "pytest>=9.0.3",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports, undefined names)
    "I",    # isort (import order)
    "N",    # PEP-8 naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade (modernize syntax)
    "B",    # flake8-bugbear (likely bugs)
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "PT",   # pytest style
    "ANN",  # flake8-annotations (type hints)
    "TCH",  # flake8-type-checking (move imports to TYPE_CHECKING)
    "PGH",  # pygrep-hooks (no broad noqa, etc.)
    "C90",  # mccabe cyclomatic complexity
    "D",    # pydocstyle (docstring style)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # assert is pytest's idiom
    "D",       # tests are self-documenting via their names
    "ANN",     # tests don't require full annotation coverage
    "PT009",   # unittest-style assertEqual etc. — file mixes unittest + pytest
    "PT011",   # pytest.raises without `match` is fine for our use
    "PT027",   # unittest-style assertRaises
]

[tool.complexipy]
max-complexity-allowed = 10
quiet = false

[tool.bumpversion]
current_version = "0.3.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
# We manage git ourselves: bump-my-version.yaml runs `bump --no-tag --no-commit`,
# commits once on a branch, and tag-release.yaml tags the squash-merge on main.
commit = false
tag = false
sign_tags = false
allow_dirty = true
tag_name = "v{new_version}"
message = "feat(release): v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

# README + the vars example pin `@v<ver>` / `eval_ref: v<ver>`; bump them so the
# published examples point at the latest tag. docs/design.md and scripts/ keep
# their historical "since v0.3.0" prose (not listed here).
[[tool.bumpversion.files]]
filename = "README.md"
search = "v{current_version}"
replace = "v{new_version}"

[[tool.bumpversion.files]]
filename = "examples/consumer-eval-vars.yaml"
search = "v{current_version}"
replace = "v{new_version}"
