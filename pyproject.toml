[project]
name = "gha-rxiv-paper-eval"
version = "0.1.0"
description = "Reusable GitHub Actions workflow that filters preprint feeds via GitHub Models."
authors = [
    {name = "qte77", email = "qte@77.gh"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "defusedxml>=0.7",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "complexipy>=4.0",
    "pytest>=9.0.3",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports, undefined names)
    "I",    # isort (import order)
    "N",    # PEP-8 naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade (modernize syntax)
    "B",    # flake8-bugbear (likely bugs)
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "PT",   # pytest style
    "ANN",  # flake8-annotations (type hints)
    "TCH",  # flake8-type-checking (move imports to TYPE_CHECKING)
    "PGH",  # pygrep-hooks (no broad noqa, etc.)
    "C90",  # mccabe cyclomatic complexity
    "D",    # pydocstyle (docstring style)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # assert is pytest's idiom
    "D",       # tests are self-documenting via their names
    "ANN",     # tests don't require full annotation coverage
    "PT009",   # unittest-style assertEqual etc. — file mixes unittest + pytest
    "PT011",   # pytest.raises without `match` is fine for our use
    "PT027",   # unittest-style assertRaises
]

[tool.complexipy]
max-complexity-allowed = 10
quiet = false
