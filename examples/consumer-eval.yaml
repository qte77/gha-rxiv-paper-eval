# Example: a consumer repo calling the reusable eval workflow from
# gha-rxiv-paper-eval. Drop this in the consumer repo at
# .github/workflows/rxiv-eval.yaml and tune the `topic`/`categories`
# to match the project.
name: rxiv weekly eval

on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays after the producer's nightly cron
  workflow_dispatch:
    inputs:
      week:
        description: "ISO week (1-53). Empty = current."
        type: string
        default: ""
      year:
        description: "ISO year. Empty = current."
        type: string
        default: ""

# `models: read` lets the auto-provided GITHUB_TOKEN call GitHub Models,
# but its quota is single-digit-per-day org-wide and gets exhausted by any
# non-trivial weekly batch. For cron use, pass a fine-grained PAT via
# `secrets.MODELS_TOKEN` (see the `secrets:` block on the eval job below).
permissions:
  contents: read
  models: read
  issues: write   # only needed if you wire issue creation below

jobs:
  eval:
    # Replace <owner> with the org/user that hosts gha-rxiv-paper-eval and
    # pin to a tag for reproducibility (e.g. @v1.2.3).
    uses: <owner>/gha-rxiv-paper-eval/.github/workflows/eval-papers.yaml@main
    with:
      topic: "<your project's relevance criterion>"
      server: biorxiv
      year: ${{ inputs.year }}
      week: ${{ inputs.week }}
      categories: "microbiology,bioinformatics,synthetic biology,pharmacology and toxicology"
      max_papers: 0
      # Cap LLM calls to the top-N papers by topic-keyword overlap
      # (title+category+abstract). Prefer over max_papers when the topic is
      # focused — it picks high-signal papers instead of the alphabetically
      # first N, which helps stay under the GitHub Models daily quota.
      max_llm_calls: 0
      model: openai/gpt-4o-mini
      enrich: true
      # feed_repo defaults to ${caller-owner}/gha-rxiv-feed-action; override if it lives elsewhere.
      # feed_repo: <feed-owner>/gha-rxiv-feed-action
    secrets:
      # Optional but strongly recommended for cron use. Create a fine-grained
      # PAT with `models: read`, store as repo secret MODELS_TOKEN. Without
      # this, GITHUB_TOKEN's shared org-wide quota will 429 after a few calls.
      models-token: ${{ secrets.MODELS_TOKEN }}

  triage:
    needs: eval
    if: ${{ fromJSON(needs.eval.outputs.relevant_count) > 0 }}
    # Reusable workflow: downloads the eval artifact and opens one issue per
    # row of extracts.jsonl. `eval_ref` MUST match the `uses: @<ref>` pin.
    uses: <owner>/gha-rxiv-paper-eval/.github/workflows/triage-to-issues.yaml@main
    with:
      artifact_name: ${{ needs.eval.outputs.artifact_name }}
      eval_ref: main
      # Optional: override label / title_prefix / eval_repo.
      # label: rxiv-feed
      # title_prefix: "rxiv:"
    permissions:
      contents: read
      issues: write
